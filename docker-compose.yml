
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: athena-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    networks:
      - athena-network

  scheduler:
    build:
      context: ./scheduler
      dockerfile: Dockerfile

    container_name: athena-scheduler

    environment:
      BACKEND_URL: http://backend:8000
      TZ: Asia/Kolkata

    depends_on:
      backend:
        condition: service_started

    restart: unless-stopped

networks:
  athena-network:
    external: true
    name: athenaai_default
