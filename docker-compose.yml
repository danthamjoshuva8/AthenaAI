
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: athena-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    networks:
      - athena-network

networks:
  athena-network:
    external: true
    name: athenaai_default
